                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // Caminho restrito de dados públicos
                const vehiclesCollection = collection(db, 'artifacts', appId, 'public', 'data', 'vehicles');

                // Listener em Tempo Real (onSnapshot)
                onSnapshot(vehiclesCollection, async (snapshot) => {
                    if (snapshot.empty) {
                        // Se o banco estiver vazio, popula pela primeira vez com os veículos iniciais
                        const batch = writeBatch(db);
                        initialVehiclesData.forEach(v => {
                            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'vehicles', v.placa);
                            batch.set(docRef, v);
                        });
                        await batch.commit();
                    } else {
                        vehicles = [];
                        snapshot.forEach(docSnap => {
                            vehicles.push(docSnap.data());
                        });
                        renderDashboard();
                    }
                }, (error) => {
                    console.error("Erro na sincronização:", error);
                    // Fallback para os dados locais se houver erro de rede
                    if (vehicles.length === 0) {
                        vehicles = [...initialVehiclesData];
                        renderDashboard();
                    }
                });

            } catch (err) {
                console.error("Erro na autenticação:", err);
                vehicles = [...initialVehiclesData];

        function initChart() {
            const ctx = document.getElementById('statusChart').getContext('2d');
            statusChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Aprovados (OK)', 'Reprovados (NOK)', 'Não Aferidos'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: ['#2d6a4f', '#d9ed92', '#e07a5f'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.label || '';
                                    const value = context.raw || 0;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                    return ` ${label}: ${value} (${percentage}%)`;
                                }
                            }
                        }
                    },
                    cutout: '70%'
                }
            });
        }

        function renderDashboard() {
            let okCount = 0;
            let nokCount = 0;
            let pendenteCount = 0;

            vehicles.forEach(v => {
                const st = (v.status || '').toUpperCase();
                if (st === 'OK') okCount++;
                else if (st === 'NOK') nokCount++;
                else pendenteCount++;
            });

            const total = vehicles.length;
            const okPercentage = total > 0 ? ((okCount / total) * 100).toFixed(1) : 0;

            document.getElementById('kpi-total').innerText = total;
            document.getElementById('kpi-ok').innerText = okCount;
            document.getElementById('kpi-nok').innerText = nokCount;
            document.getElementById('kpi-pendente').innerText = pendenteCount;
            document.getElementById('kpi-rate').innerText = `${okPercentage}%`;
            document.getElementById('kpi-rate-bar').style.width = `${okPercentage}%`;

            if (!statusChart) {
                initChart();
            }

            if (statusChart) {
                statusChart.data.datasets[0].data = [okCount, nokCount, pendenteCount];
                statusChart.update();
            }

            const legendContainer = document.getElementById('chart-legend');
            legendContainer.innerHTML = `
                <div class="flex items-center justify-between text-sm"><span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-700"></span> Aprovados (OK)</span><span class="font-bold text-gray-700">${okCount}</span></div>
                <div class="flex items-center justify-between text-sm"><span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-eco-300"></span> Reprovados (NOK)</span><span class="font-bold text-gray-700">${nokCount}</span></div>
                <div class="flex items-center justify-between text-sm"><span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-amber-600"></span> Não Aferidos</span><span class="font-bold text-gray-700">${pendenteCount}</span></div>
            `;

            const searchInput = (document.getElementById('searchInput').value || '').toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            const filteredVehicles = vehicles.filter(v => {
                const matchesSearch = v.placa.toLowerCase().includes(searchInput) || 
                                      (v.marca && v.marca.toLowerCase().includes(searchInput)) || 
                                      (v.modelo && v.modelo.toLowerCase().includes(searchInput));
                
                const st = (v.status || '').toUpperCase();
                let matchesStatus = true;
                if (statusFilter === 'OK') matchesStatus = (st === 'OK');
                else if (statusFilter === 'NOK') matchesStatus = (st === 'NOK');
                else if (statusFilter === 'PENDENTE') matchesStatus = (st !== 'OK' && st !== 'NOK');

                return matchesSearch && matchesStatus;
            });

            const tbody = document.getElementById('vehiclesTableBody');
            tbody.innerHTML = '';

            if (filteredVehicles.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">Nenhum veículo encontrado com os filtros atuais.</td></tr>`;
                return;
            }

            filteredVehicles.forEach(v => {
                const st = (v.status || '').toUpperCase();
                let badgeClass = 'bg-amber-100 text-amber-800 border-amber-300';
                let badgeText = v.status || 'NÃO AFERIDO';

                if (st === 'OK') {
                    badgeClass = 'bg-emerald-100 text-emerald-800 border-emerald-300';
                    badgeText = 'OK';
                } else if (st === 'NOK') {
                    badgeClass = 'bg-rose-100 text-rose-800 border-rose-300';
                    badgeText = 'NOK';
                }

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-eco-50/50 transition border-b border-gray-100';
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap font-mono font-bold text-gray-800">${v.placa}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${v.marca || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${v.modelo || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 font-medium">${v.validade || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full border ${badgeClass}">
                            ${badgeText}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${v.atualizacao || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="openEditModal('${v.placa}')" class="text-emerald-700 hover:text-emerald-900 bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-lg transition border border-emerald-200">
                            <i class="fa-solid fa-pen-to-square mr-1"></i> Aferir / Editar
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.exportCSV = function() {
            let csv = 'PLACA;MARCA;MODELO;VALIDADE SELO VERDE;STATUS;ATUALIZACAO DO VENCIMENTO\n';
            vehicles.forEach(v => {
                csv += `${v.placa};${v.marca || ''};${v.modelo || ''};${v.validade || ''};${v.status || ''};${v.atualizacao || ''}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'trans_nogueira_selo_verde_2026.csv';
            link.click();
        };

        function showNotification(message, type = 'success') {
            const notif = document.createElement('div');
            notif.className = `fixed bottom-5 right-5 z-50 px-6 py-3 rounded-xl shadow-lg text-white text-sm font-medium transition transform translate-y-2 opacity-0 flex items-center gap-3 ${type === 'success' ? 'bg-emerald-800 border border-emerald-600' : 'bg-red-700'}`;
            notif.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-300' : 'fa-circle-exclamation'}"></i> ${message}`;
            document.body.appendChild(notif);
            
            setTimeout(() => {
                notif.classList.remove('translate-y-2', 'opacity-0');
            }, 50);

            setTimeout(() => {
                notif.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => notif.remove(), 300);
            }, 3500);
        }
